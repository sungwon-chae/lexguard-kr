<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>LexGuard KR</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      background: #0f172a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      font-size: 12px;
      line-height: 1.5;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-row {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .status-row .label { color: #94a3b8; font-size: 11px; }
    .status-row .value { font-weight: 600; margin-top: 2px; }
    .ok    { color: #4ade80; }
    .warn  { color: #fbbf24; }
    .fail  { color: #f87171; }
    footer {
      color: #64748b;
      font-size: 10px;
      margin-top: 12px;
      line-height: 1.4;
    }
    a { color: #60a5fa; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>⚖ LexGuard KR</h1>
  <div class="status-row">
    <div class="label">인덱스 상태</div>
    <div class="value" id="status">불러오는 중…</div>
  </div>
  <div class="status-row">
    <div class="label">법령 수</div>
    <div class="value" id="law-count">—</div>
  </div>
  <div class="status-row">
    <div class="label">조문 수</div>
    <div class="value" id="article-count">—</div>
  </div>
  <div class="status-row">
    <div class="label">빌드 시각</div>
    <div class="value" id="built-at">—</div>
  </div>
  <footer>
    본 도구는 법령·조문 존재 여부만 1차 확인합니다.
    조문 해석·법적 타당성은 검증하지 않습니다.
  </footer>
  <script src="popup.js"></script>
</body>
</html>
